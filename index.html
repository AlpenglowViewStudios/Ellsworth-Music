<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ellsworth Barrett | Alpenglow View Studios</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background:
    radial-gradient(circle at top, rgba(130,80,25,.28), transparent 28%),
    linear-gradient(180deg,#102438 0%,#08121b 42%,#050505 100%);
  color: #f5efe4;
  font-family: Georgia, "Times New Roman", serif;
}

.page {
  width: 100%;
  max-width: 900px;
  margin: auto;
  padding: 18px 14px 32px;
}

/* HEADER */

.header {
  text-align: center;
}

.top-row {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 18px;
}

.profile {
  width: 105px;
  height: 105px;
  border-radius: 50%;
  object-fit: cover;
  border: 3px solid #d7a744;
  box-shadow: 0 6px 18px rgba(0,0,0,.55);
}

.tagline {
  color: #e2ad45;
  font-family: cursive;
  font-size: 21px;
  line-height: 1.05;
  text-align: left;
}

.artist-name {
  margin: 10px 0 0;
  font-family: cursive;
  font-size: clamp(42px, 12vw, 72px);
  font-weight: normal;
  line-height: .95;
}

.studio {
  margin-top: 8px;
  letter-spacing: 4px;
  font-size: 13px;
}

.location {
  margin-top: 5px;
  color: #d8a842;
  letter-spacing: 3px;
  font-size: 12px;
}

/* SONGS */

.songs {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-top: 24px;
}

.song-card {
  text-align: center;
  min-width: 0;
}

.cover {
  width: 100%;
  aspect-ratio: 1 / 1;
  display: block;
  object-fit: cover;
  border-radius: 6px;
  border: 1.5px solid #c8983c;
  box-shadow: 0 8px 18px rgba(0,0,0,.55);
}

.song-title {
  min-height: 50px;
  margin-top: 9px;
  padding: 0 3px;
  font-weight: bold;
  font-size: clamp(15px, 4.3vw, 22px);
  line-height: 1.08;
}

.play-button {
  width: 92%;
  margin: 8px auto 0;
  padding: 10px 4px;
  border: 2px solid #d8a23e;
  border-radius: 30px;
  background: rgba(10,10,10,.9);
  color: white;
  font-size: 15px;
  letter-spacing: 1px;
  cursor: pointer;
}

.play-button:hover {
  background: #20180b;
}

/* PROGRESS */

.progress-wrap {
  margin-top: 9px;
}

.progress {
  width: 94%;
}

.time {
  font-family: Arial,sans-serif;
  font-size: 10px;
  color: #aaa;
  margin-top: 2px;
}

/* LISTEN */

.section-title {
  margin: 32px 0 14px;
  text-align: center;
  letter-spacing: 5px;
  font-size: 12px;
}

.streaming {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

.service {
  display: block;
  padding: 11px 8px;
  text-align: center;
  color: white;
  text-decoration: none;
  border: 1px solid #b88a35;
  border-radius: 30px;
  background: #111;
  font-family: Arial,sans-serif;
  font-size: 14px;
}

/* ACTIONS */

.actions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-top: 14px;
}

.action {
  border: 1px solid #c99b40;
  border-radius: 30px;
  background: #111;
  color: white;
  padding: 11px 6px;
  text-align: center;
  text-decoration: none;
  font-family: Arial,sans-serif;
  font-size: 14px;
  cursor: pointer;
}

/* FOOTER */

.footer {
  margin-top: 30px;
  text-align: center;
}

.footer-brand {
  letter-spacing: 3px;
  font-size: 12px;
}

.footer-location {
  margin-top: 5px;
  color: #d1a03f;
  letter-spacing: 2px;
  font-size: 11px;
}

.footer-tag {
  margin-top: 20px;
  color: #aaa;
  letter-spacing: 4px;
  font-size: 10px;
}

/* VERY SMALL PHONES */

@media (max-width: 360px) {

  .page {
    padding-left: 9px;
    padding-right: 9px;
  }

  .songs {
    gap: 8px;
  }

  .profile {
    width: 85px;
    height: 85px;
  }

  .tagline {
    font-size: 17px;
  }

  .song-title {
    font-size: 14px;
  }

  .play-button {
    font-size: 13px;
  }
}

/* TABLET / COMPUTER */

@media (min-width: 700px) {

  .page {
    padding: 28px;
  }

  .profile {
    width: 135px;
    height: 135px;
  }

  .tagline {
    font-size: 26px;
  }

  .songs {
    gap: 32px;
  }

  .song-title {
    font-size: 26px;
  }

  .play-button {
    max-width: 260px;
  }

  .streaming,
  .actions {
    max-width: 560px;
    margin-left: auto;
    margin-right: auto;
  }
}
</style>
</head>

<body>

<div class="page">

  <header class="header">

    <div class="top-row">

      <img
        src="ellsworth-profile.png"
        class="profile"
        alt="Ellsworth Barrett">

      <div class="tagline">
        Music<br>
        Brings<br>
        People<br>
        Together
      </div>

    </div>

    <h1 class="artist-name">
      Ellsworth Barrett
    </h1>

    <div class="studio">
      ALPENGLOW VIEW STUDIOS
    </div>

    <div class="location">
      POLSON, MONTANA
    </div>

  </header>


  <section class="songs">

    <!-- SONG ONE -->

    <div class="song-card">

      <img
        src="The Ink Finally Dried 1.0.png"
        class="cover"
        alt="The Ink Has Finally Dried">

      <div class="song-title">
        The Ink Has Finally Dried
      </div>

      <audio
        id="audio1"
        preload="metadata"
        src="ink.mp3">
      </audio>

      <button
        id="button1"
        class="play-button"
        onclick="toggleSong(1)">
        ▶ PLAY
      </button>

      <div class="progress-wrap">

        <input
          id="progress1"
          class="progress"
          type="range"
          min="0"
          max="100"
          value="0">

        <div
          id="time1"
          class="time">
          0:00 / --:--
        </div>

      </div>

    </div>


    <!-- SONG TWO -->

    <div class="song-card">

      <img
        src="she-knew-me.png"
        class="cover"
        alt="She Saw Me Before She Knew Me">

      <div class="song-title">
        She Saw Me Before She Knew Me
      </div>

      <audio
        id="audio2"
        preload="metadata"
        src="she-saw-me.mp3">
      </audio>

      <button
        id="button2"
        class="play-button"
        onclick="toggleSong(2)">
        ▶ PLAY
      </button>

      <div class="progress-wrap">

        <input
          id="progress2"
          class="progress"
          type="range"
          min="0"
          max="100"
          value="0">

        <div
          id="time2"
          class="time">
          0:00 / --:--
        </div>

      </div>

    </div>

  </section>


  <div class="section-title">
    LISTEN ON
  </div>

  <div class="streaming">

    <a
      class="service"
      href="https://open.spotify.com/artist/3UT4RV8hkQFtdRP3pOsziC"
      target="_blank"
      rel="noopener">
      Spotify
    </a>

    <a
      class="service"
      href="https://distrokid.com/hyperfollow/ellsworthbarrett/she-saw-me-before-she-knew-me"
      target="_blank"
      rel="noopener">
      Streaming Links
    </a>

  </div>


  <div class="actions">

    <button
      class="action"
      onclick="sharePage()">
      Share
    </button>

    <a
      class="action"
      href="https://www.facebook.com/profile.php?id=61593677165648"
      target="_blank"
      rel="noopener">
      Facebook
    </a>

  </div>


  <footer class="footer">

    <div class="footer-brand">
      ALPENGLOW VIEW STUDIOS
    </div>

    <div class="footer-location">
      POLSON, MONTANA
    </div>

    <div class="footer-tag">
      SONGS · STORIES · SECOND CHANCES
    </div>

  </footer>

</div>


<script>

const audio1 = document.getElementById("audio1");
const audio2 = document.getElementById("audio2");

const button1 = document.getElementById("button1");
const button2 = document.getElementById("button2");

const progress1 = document.getElementById("progress1");
const progress2 = document.getElementById("progress2");

const time1 = document.getElementById("time1");
const time2 = document.getElementById("time2");


function formatTime(seconds) {

  if (!isFinite(seconds)) {
    return "--:--";
  }

  const minutes =
    Math.floor(seconds / 60);

  const secs =
    Math.floor(seconds % 60);

  return minutes + ":" +
    secs.toString().padStart(2,"0");
}


function toggleSong(number) {

  const selected =
    number === 1 ? audio1 : audio2;

  const other =
    number === 1 ? audio2 : audio1;

  other.pause();

  if (selected.paused) {
    selected.play();
  }
  else {
    selected.pause();
  }
}


function updateButtons() {

  button1.textContent =
    audio1.paused ? "▶ PLAY" : "❚❚ PAUSE";

  button2.textContent =
    audio2.paused ? "▶ PLAY" : "❚❚ PAUSE";
}


audio1.addEventListener("play", updateButtons);
audio1.addEventListener("pause", updateButtons);

audio2.addEventListener("play", updateButtons);
audio2.addEventListener("pause", updateButtons);


audio1.addEventListener("timeupdate", function() {

  if (audio1.duration) {

    progress1.value =
      audio1.currentTime /
      audio1.duration * 100;

    time1.textContent =
      formatTime(audio1.currentTime) +
      " / " +
      formatTime(audio1.duration);
  }

});


audio2.addEventListener("timeupdate", function() {

  if (audio2.duration) {

    progress2.value =
      audio2.currentTime /
      audio2.duration * 100;

    time2.textContent =
      formatTime(audio2.currentTime) +
      " / " +
      formatTime(audio2.duration);
  }

});


audio1.addEventListener("loadedmetadata", function() {

  time1.textContent =
    "0:00 / " +
    formatTime(audio1.duration);

});


audio2.addEventListener("loadedmetadata", function() {

  time2.textContent =
    "0:00 / " +
    formatTime(audio2.duration);

});


progress1.addEventListener("input", function() {

  if (audio1.duration) {

    audio1.currentTime =
      progress1.value / 100 *
      audio1.duration;
  }

});


progress2.addEventListener("input", function() {

  if (audio2.duration) {

    audio2.currentTime =
      progress2.value / 100 *
      audio2.duration;
  }

});


async function sharePage() {

  const shareData = {
    title: "Ellsworth Barrett",
    text: "Listen to music by Ellsworth Barrett.",
    url: window.location.href
  };

  if (navigator.share) {

    try {
      await navigator.share(shareData);
    }
    catch (e) {}

  }
  else {

    try {

      await navigator.clipboard.writeText(
        window.location.href
      );

      alert(
        "Link copied to clipboard."
      );

    }
    catch (e) {

      alert(
        window.location.href
      );
    }
  }
}

</script>

</body>
</html>
