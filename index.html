<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ellsworth Barrett | Alpenglow View Studios</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 18px;
  background: #111;
  color: #fff;
  font-family: Arial, sans-serif;
  text-align: center;
}

.container {
  max-width: 620px;
  margin: auto;
}

.header {
  margin: 8px 0 22px;
}

.header h1 {
  margin: 0;
  font-size: 28px;
  font-weight: normal;
}

.header .studio {
  margin-top: 7px;
  font-size: 11px;
  letter-spacing: 3px;
  color: #999;
}

.song {
  margin-bottom: 38px;
}

.cover {
  display: block;
  width: 100%;
  max-width: 560px;
  height: auto;
  margin: auto;
  border-radius: 8px;
  box-shadow: 0 8px 30px rgba(0,0,0,.6);
}

.song-title {
  margin: 15px 0 3px;
  font-size: 22px;
  font-weight: bold;
}

.artist {
  margin-bottom: 14px;
  font-size: 16px;
  font-style: italic;
  color: #ccc;
}

.player {
  max-width: 560px;
  margin: auto;
}

.progress-wrap {
  display: flex;
  align-items: center;
  gap: 9px;
  font-size: 12px;
  color: #aaa;
}

.progress {
  flex: 1;
  height: 4px;
  cursor: pointer;
}

.controls {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 17px;
  margin-top: 11px;
}

.control-btn {
  width: 43px;
  height: 43px;
  border: 1px solid #555;
  border-radius: 50%;
  background: #222;
  color: white;
  font-size: 18px;
  cursor: pointer;
}

.play-btn {
  width: 52px;
  height: 52px;
  background: white;
  color: #111;
  border: none;
  font-size: 21px;
}

.divider {
  height: 1px;
  background: #333;
  margin: 5px auto 35px;
  max-width: 500px;
}

.actions {
  display: flex;
  justify-content: center;
  gap: 12px;
  flex-wrap: wrap;
  margin: 10px 0 22px;
}

.action-btn {
  padding: 10px 17px;
  border: 1px solid #555;
  border-radius: 999px;
  background: #1c1c1c;
  color: white;
  text-decoration: none;
  font-size: 14px;
  cursor: pointer;
}

.footer {
  margin: 25px 0 10px;
  font-size: 11px;
  letter-spacing: 3px;
  color: #777;
}

</style>
</head>

<body>

<div class="container">

  <div class="header">
    <h1>Ellsworth Barrett</h1>
    <div class="studio">ALPENGLOW VIEW STUDIOS</div>
  </div>


  <!-- SONG ONE -->

  <div class="song">

    <img
      class="cover"
      src="The Ink Finally Dried 1.0.png"
      alt="The Ink Has Finally Dried">

    <div class="song-title">
      The Ink Has Finally Dried
    </div>

    <div class="artist">
      ~ Ellsworth Barrett ~
    </div>

    <div class="player">

      <audio id="audio1" preload="metadata">
        <source src="ink.mp3" type="audio/mpeg">
      </audio>

      <div class="progress-wrap">
        <span id="time1">0:00</span>

        <input
          id="progress1"
          class="progress"
          type="range"
          min="0"
          max="100"
          value="0">

        <span id="duration1">--:--</span>
      </div>

      <div class="controls">

        <button
          class="control-btn"
          onclick="skip('audio1',-10)">
          ↶
        </button>

        <button
          id="play1"
          class="control-btn play-btn"
          onclick="togglePlay('audio1','play1')">
          ▶
        </button>

        <button
          class="control-btn"
          onclick="skip('audio1',10)">
          ↷
        </button>

      </div>

    </div>
  </div>


  <div class="divider"></div>


  <!-- SONG TWO -->

  <div class="song">

    <img
      class="cover"
      src="she-knew-me.png"
      alt="She Saw Me Before She Knew Me">

    <div class="song-title">
      She Saw Me Before She Knew Me
    </div>

    <div class="artist">
      ~ Ellsworth Barrett ~
    </div>

    <div class="player">

      <audio id="audio2" preload="metadata">
        <source src="she-saw-me.mp3" type="audio/mpeg">
      </audio>

      <div class="progress-wrap">
        <span id="time2">0:00</span>

        <input
          id="progress2"
          class="progress"
          type="range"
          min="0"
          max="100"
          value="0">

        <span id="duration2">--:--</span>
      </div>

      <div class="controls">

        <button
          class="control-btn"
          onclick="skip('audio2',-10)">
          ↶
        </button>

        <button
          id="play2"
          class="control-btn play-btn"
          onclick="togglePlay('audio2','play2')">
          ▶
        </button>

        <button
          class="control-btn"
          onclick="skip('audio2',10)">
          ↷
        </button>

      </div>

    </div>
  </div>


  <div class="divider"></div>


  <!-- SHARE / FACEBOOK -->

  <div class="actions">

    <button
      class="action-btn"
      onclick="sharePage()">
      Share
    </button>

    <a
      class="action-btn"
      href="https://www.facebook.com/profile.php?id=61593677165648"
      target="_blank"
      rel="noopener noreferrer">
      Facebook
    </a>

  </div>


  <div class="footer">
    ALPENGLOW VIEW STUDIOS · POLSON, MONTANA
  </div>

</div>


<script>

const songs = [
  {
    audio: document.getElementById("audio1"),
    play: document.getElementById("play1"),
    progress: document.getElementById("progress1"),
    time: document.getElementById("time1"),
    duration: document.getElementById("duration1")
  },
  {
    audio: document.getElementById("audio2"),
    play: document.getElementById("play2"),
    progress: document.getElementById("progress2"),
    time: document.getElementById("time2"),
    duration: document.getElementById("duration2")
  }
];


function formatTime(seconds) {

  if (isNaN(seconds)) return "0:00";

  const minutes = Math.floor(seconds / 60);
  const secs = Math.floor(seconds % 60);

  return minutes + ":" +
    secs.toString().padStart(2,"0");
}


function togglePlay(audioId, buttonId) {

  const selectedAudio =
    document.getElementById(audioId);

  songs.forEach(song => {

    if (song.audio !== selectedAudio) {
      song.audio.pause();
    }

  });

  if (selectedAudio.paused) {
    selectedAudio.play();
  } else {
    selectedAudio.pause();
  }
}


function skip(audioId, seconds) {

  const audio =
    document.getElementById(audioId);

  audio.currentTime += seconds;
}


songs.forEach(song => {

  song.audio.addEventListener(
    "loadedmetadata",
    () => {
      song.duration.textContent =
        formatTime(song.audio.duration);
    }
  );


  song.audio.addEventListener(
    "timeupdate",
    () => {

      if (song.audio.duration) {

        song.progress.value =
          (song.audio.currentTime /
           song.audio.duration) * 100;

      }

      song.time.textContent =
        formatTime(song.audio.currentTime);

    }
  );


  song.audio.addEventListener(
    "play",
    () => {
      song.play.textContent = "❚❚";
    }
  );


  song.audio.addEventListener(
    "pause",
    () => {
      song.play.textContent = "▶";
    }
  );


  song.progress.addEventListener(
    "input",
    () => {

      if (song.audio.duration) {

        song.audio.currentTime =
          (song.progress.value / 100) *
          song.audio.duration;

      }

    }
  );

});


async function sharePage() {

  const data = {
    title: "Ellsworth Barrett",
    text:
      "Listen to music by Ellsworth Barrett.",
    url: window.location.href
  };

  if (navigator.share) {

    try {
      await navigator.share(data);
    } catch (err) {}

  } else {

    await navigator.clipboard.writeText(
      window.location.href
    );

    alert("Link copied to clipboard.");

  }
}

</script>

</body>
</html>
