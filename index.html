<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>The Ink Has Finally Dried | Ellsworth Barrett</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 18px;
      background: #111;
      color: #fff;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    .container {
      max-width: 620px;
      margin: 0 auto;
    }

    .cover {
      display: block;
      width: 100%;
      max-width: 560px;
      height: auto;
      margin: 0 auto;
      border-radius: 8px;
      box-shadow: 0 8px 30px rgba(0,0,0,.6);
    }

    .title {
      margin-top: 18px;
      margin-bottom: 4px;
      font-size: 25px;
      font-weight: 700;
    }

    .artist {
      margin: 0 0 18px;
      font-size: 18px;
      font-style: italic;
      color: #ddd;
    }

    .player-wrap {
      max-width: 560px;
      margin: 0 auto;
    }

    .progress-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
      font-size: 12px;
      color: #aaa;
    }

    .progress {
      flex: 1;
      appearance: none;
      height: 4px;
      border-radius: 4px;
      background: #555;
      outline: none;
      cursor: pointer;
    }

    .progress::-webkit-slider-thumb {
      appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #fff;
      cursor: pointer;
    }

    .progress::-moz-range-thumb {
      width: 14px;
      height: 14px;
      border: none;
      border-radius: 50%;
      background: #fff;
      cursor: pointer;
    }

    .controls {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 18px;
      margin-bottom: 16px;
    }

    .control-btn {
      width: 48px;
      height: 48px;
      border: 1px solid #666;
      border-radius: 50%;
      background: #222;
      color: #fff;
      font-size: 20px;
      cursor: pointer;
    }

    .play-btn {
      width: 58px;
      height: 58px;
      font-size: 24px;
      background: #fff;
      color: #111;
      border: none;
    }

    .action-row {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 6px;
    }

    .action-btn {
      display: inline-block;
      padding: 9px 15px;
      border: 1px solid #555;
      border-radius: 999px;
      background: #1c1c1c;
      color: #fff;
      text-decoration: none;
      font-size: 14px;
      cursor: pointer;
    }

    .action-btn:hover {
      background: #2a2a2a;
    }

    .studio {
      margin-top: 22px;
      font-size: 11px;
      letter-spacing: 3px;
      color: #777;
    }
  </style>
</head>

<body>

  <div class="container">

    <img
      class="cover"
      src="The Ink Finally Dried 1.0.png"
      alt="The Ink Has Finally Dried album cover">

    <div class="title">
      The Ink Has Finally Dried
    </div>

    <div class="artist">
      ~ Ellsworth Barrett ~
    </div>

    <div class="player-wrap">

      <audio id="audio" preload="metadata">
        <source src="ink.mp3" type="audio/mpeg">
      </audio>

      <div class="progress-wrap">
        <span id="currentTime">0:00</span>

        <input
          id="progress"
          class="progress"
          type="range"
          min="0"
          max="100"
          value="0">

        <span id="duration">4:47</span>
      </div>

      <div class="controls">

        <button
          class="control-btn"
          onclick="skip(-10)"
          aria-label="Back 10 seconds">
          ↶
        </button>

        <button
          id="playButton"
          class="control-btn play-btn"
          onclick="togglePlay()"
          aria-label="Play">
          ▶
        </button>

        <button
          class="control-btn"
          onclick="skip(10)"
          aria-label="Forward 10 seconds">
          ↷
        </button>

      </div>

      <div class="action-row">

        <button
          class="action-btn"
          onclick="sharePage()">
          Share
        </button>

        <a
          class="action-btn"
          href="https://www.facebook.com/profile.php?id=61593677165648"
          target="_blank"
          rel="noopener noreferrer">
          Facebook
        </a>

      </div>

    </div>

    <div class="studio">
      ALPENGLOW VIEW STUDIOS
    </div>

  </div>

  <script>
    const audio = document.getElementById("audio");
    const playButton = document.getElementById("playButton");
    const progress = document.getElementById("progress");
    const currentTime = document.getElementById("currentTime");
    const duration = document.getElementById("duration");

    function formatTime(seconds) {
      if (isNaN(seconds)) return "0:00";

      const minutes = Math.floor(seconds / 60);
      const secs = Math.floor(seconds % 60);

      return minutes + ":" + secs.toString().padStart(2, "0");
    }

    function togglePlay() {
      if (audio.paused) {
        audio.play();
      } else {
        audio.pause();
      }
    }

    function skip(seconds) {
      audio.currentTime += seconds;
    }

    audio.addEventListener("play", () => {
      playButton.textContent = "❚❚";
    });

    audio.addEventListener("pause", () => {
      playButton.textContent = "▶";
    });

    audio.addEventListener("loadedmetadata", () => {
      duration.textContent = formatTime(audio.duration);
    });

    audio.addEventListener("timeupdate", () => {
      if (audio.duration) {
        progress.value = (audio.currentTime / audio.duration) * 100;
      }

      currentTime.textContent = formatTime(audio.currentTime);
    });

    progress.addEventListener("input", () => {
      if (audio.duration) {
        audio.currentTime =
          (progress.value / 100) * audio.duration;
      }
    });

    async function sharePage() {
      const shareData = {
        title: "The Ink Has Finally Dried",
        text: "Listen to The Ink Has Finally Dried by Ellsworth Barrett.",
        url: window.location.href
      };

      if (navigator.share) {
        try {
          await navigator.share(shareData);
        } catch (err) {
          // User cancelled sharing
        }
      } else {
        navigator.clipboard.writeText(window.location.href);

        alert("Link copied to clipboard.");
      }
    }
  </script>

</body>
</html>
